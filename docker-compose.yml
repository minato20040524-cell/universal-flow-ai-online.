services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: universal
      POSTGRES_PASSWORD: universal
      POSTGRES_DB: universal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U universal"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
