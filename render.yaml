services:
  - type: web
    name: universal-flow-ai
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: MASTER_KEY
        generateValue: true
      - key: ALLOW_SIGNUP
        value: "false"
      - key: TRUST_PROXY
        value: "true"
      - key: PORT
        value: "10000"
        
